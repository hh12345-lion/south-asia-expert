[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Lead_notification_setup.md — rewrite so production uses the Netlify function
# (not the Next.js App Router route). Local `next dev` still uses app/api/submit-lead.
[[redirects]]
  from = "/api/submit-lead"
  to = "/.netlify/functions/submit-lead"
  status = 200
  force = true

# Single-hop canonical host: apex HTTPS (fixes www redirect chain + Ahrefs canonical issues)
[[redirects]]
  from = "https://www.southasiaexpert.com/*"
  to = "https://southasiaexpert.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.southasiaexpert.com/*"
  to = "https://southasiaexpert.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://southasiaexpert.com/*"
  to = "https://southasiaexpert.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
